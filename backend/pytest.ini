[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # Our own deprecations are bugs, so they fail the run.
    error::DeprecationWarning
    # Starlette 0.41's TestClient imports the anyio.abc.BlockingPortal alias,
    # which anyio 4.15 deprecated. Third-party and unreachable from here, and
    # anyio is transitive so CI resolves a newer one than any local venv.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
