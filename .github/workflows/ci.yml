name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # No services block: the models declare JSONB and UUID as dialect
        # variants, so the API tests run the real app against SQLite and CI
        # needs no database container.
        run: python -m pytest -q
      - name: Engine smoke run
        # Catches the class of bug a unit test cannot: agents that individually
        # behave correctly but produce zero trades when run together. The script
        # asserts nothing itself, so the grep is what makes this a real check.
        run: |
          python scripts/demo_run.py --steps 400 --shock-step 200 | tee /tmp/run.txt
          grep -q "Trades: 0" /tmp/run.txt && { echo "::error::simulation produced no trades"; exit 1; } || true

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
