server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: /simulations/<id> is a React route, not a file, so any
    # unmatched path has to fall through to index.html or a page refresh 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy, mirroring what the Vite dev server does. Keeps CORS
    # out of the browser's path entirely.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A long simulation is a slow synchronous request. The nginx default of
        # 60s would cut off a 20,000-step run mid-flight.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
