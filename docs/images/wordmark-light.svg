<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-label="TradeArena X">
  <style>
    .wm { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 46px; font-weight: 700; letter-spacing: -1px; }
    .sub { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; letter-spacing: 2.6px; }
  </style>

  <!-- Order-book glyph: asks above the touch, bids below, widths are resting size. -->
  <g>
    <rect x="8"  y="20" width="42" height="9"  rx="2" fill="#f2544b" opacity="0.50"/>
    <rect x="8"  y="33" width="26" height="9"  rx="2" fill="#f2544b" opacity="0.75"/>
    <rect x="8"  y="46" width="14" height="9"  rx="2" fill="#f2544b"/>
    <rect x="8"  y="59" width="52" height="2"  rx="1" fill="#0284c7"/>
    <rect x="8"  y="65" width="16" height="9"  rx="2" fill="#26d07c"/>
    <rect x="8"  y="78" width="34" height="9"  rx="2" fill="#26d07c" opacity="0.75"/>
    <rect x="8"  y="91" width="48" height="9"  rx="2" fill="#26d07c" opacity="0.50"/>
  </g>

  <text class="wm" x="86" y="58" fill="#0e121a">TradeArena<tspan fill="#0284c7">X</tspan></text>
  <text class="sub" x="88" y="88" fill="#6b7686">EVENT-DRIVEN MARKET SIMULATOR</text>
</svg>
